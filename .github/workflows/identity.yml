# Identity in the image: build the linux/amd64 image from this commit, then, inside it, under Docker or Apptainer:
#
#   1. verify, through the image's entrypoint as a user runs it (the runner's user, the work directory mounted at its
#      own path), on a subset of the 1kG fixture: every output must be IDENTICAL;
#   2. tests/legacy_vs_fast.sh with the image's code, environment and references (PROHAP_CODE=/opt/prohap): the
#      reference, then ProHap-fast, on the fixtures of a tier, every output IDENTICAL, and the reference's outputs
#      equal to the golden checksums in tests/fixtures/expected.v113.sha256 (-g). The golden checksums catch what
#      legacy vs fast cannot: a change to the Snakefile, the references or the environment hits both arms alike.
#
# When: Docker with the small tier on every push to main and every pull request; Docker and Apptainer with the small
# and medium tiers nightly and on demand (Actions > identity > Run workflow). The large tier is for releases, run
# locally (its reference run on 26,000 samples needs about 12 GB).
#
# The image's layers are cached in GHCR (ghcr.io/<owner>/prohap-fast-buildcache). Pull requests only read the cache.
# A build reruns only the layers whose inputs changed: the references when ENSEMBL_RELEASE, prebuild_refs.py,
# legacy/src, crap.fasta or the environment change; the environment when envs/ changes. Nothing else is published:
# release images are built and pushed from a workstation with container/build_image.sh.
name: identity

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      apptainer:
        description: Also run under Apptainer
        type: boolean
        default: true
      tiers:
        description: tests/legacy_vs_fast.sh tiers (small, medium, large)
        type: string
        default: small medium

permissions:
  contents: read
  packages: write

concurrency:
  group: identity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  ENSEMBL_RELEASE: '113'
  IMAGE_NAME: prohap-fast-ci
  CACHE_REF: ghcr.io/${{ github.repository_owner }}/prohap-fast-buildcache:ensembl.v113-amd64
  # small on pushes and pull requests; small and medium nightly; the given tiers on demand
  TIERS: ${{ github.event_name == 'workflow_dispatch' && inputs.tiers || (github.event_name == 'schedule' && 'small medium' || 'small') }}

jobs:
  identity:
    name: identity (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apptainer)) && '["docker", "apptainer"]' || '["docker"]') }}
    steps:
      # The image is about 9 GB, and the builder keeps a second copy until the image is loaded into Docker.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/julia* /opt/microsoft /usr/local/share/powershell \
            /usr/local/share/chromium /opt/az
          docker image prune -af > /dev/null
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: |
          cache=(--cache-from "type=registry,ref=$CACHE_REF")
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ matrix.runtime }}" = docker ]; then
            cache+=(--cache-to "type=registry,ref=$CACHE_REF,mode=max,image-manifest=true,oci-mediatypes=true")
          fi
          container/build_image.sh --release "$ENSEMBL_RELEASE" --platform linux/amd64 --name "$IMAGE_NAME" \
            -- --progress plain "${cache[@]}"
          echo "IMAGE=$IMAGE_NAME:$(cat VERSION)-ensembl.v$ENSEMBL_RELEASE-amd64" >> "$GITHUB_ENV"
          # the builder's copy of the layers is no longer needed
          docker buildx prune -af > /dev/null
          df -h /

      - name: Install Apptainer 1.5.5
        if: matrix.runtime == 'apptainer'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/apptainer.deb" \
            https://github.com/apptainer/apptainer/releases/download/v1.5.5/apptainer_1.5.5_amd64.deb
          echo "25095d3711504b3e8657dbb2e172ef8db9db43c4503d940c9c36b105db8dce77  $RUNNER_TEMP/apptainer.deb" \
            | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$RUNNER_TEMP/apptainer.deb"
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Apptainer runs in one
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          apptainer --version

      - name: Convert the image to a SIF
        if: matrix.runtime == 'apptainer'
        run: |
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$APPTAINER_TMPDIR"
          apptainer build "$RUNNER_TEMP/prohap-fast.sif" "docker-daemon:$IMAGE"
          rm -rf "$APPTAINER_TMPDIR"
          # by ID: build_image.sh tagged it twice
          docker image rm -f "$(docker image inspect --format '{{.Id}}' "$IMAGE")" > /dev/null
          echo "IMAGE=$RUNNER_TEMP/prohap-fast.sif" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/prohap-fast.sif"
          df -h /

      - name: verify through the entrypoint
        run: tests/ci_identity.sh --runtime "${{ matrix.runtime }}" --image "$IMAGE" --work "$RUNNER_TEMP/identity" verify

      - name: legacy_vs_fast.sh in the image (${{ env.TIERS }}), golden checksums
        run: |
          tests/ci_identity.sh --runtime "${{ matrix.runtime }}" --image "$IMAGE" --work "$RUNNER_TEMP/identity" \
            tiers $TIERS

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/identity/*.log
            ${{ runner.temp }}/identity/verify/verify_runs/
            ${{ runner.temp }}/identity/tmp/legacy_vs_fast.*/*/*.log
            ${{ runner.temp }}/identity/tmp/legacy_vs_fast.*/*/*/log/
          if-no-files-found: ignore
          retention-days: 14
