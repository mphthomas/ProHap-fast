# Simulated fixture, small tier: 2,500 samples; chromosome 20 with pandas-ambiguous IDs, 21 with rs IDs, 22 with `.`
# IDs in two VCF chunks, X from its PAR1 genes on with haploid males; 5 VCF samples missing from the metadata.
# Every variant and haplotype kept (thresholds 0), cDNA FASTA on, plain-text outputs, 1 thread.
#
# Run by tests/legacy_vs_fast.sh in a work directory that holds simulated/ (the data of `make_data.py mix`) and
# crap.fasta. References come from $PROHAP_REFS (refs_dir is empty).

implementation: fast
# identity fixtures: with fix_bugs off the fast code must write the reference's output byte for byte
fix_bugs: false
ensembl_release: 113
refs_dir: ""

chromosomes: ["20", "21", "22", "X"]

contaminants_fasta: "crap.fasta"

included_transcript_biotypes: ""
only_MANE_select: True
custom_transcript_list: "simulated/transcripts.csv"

final_fasta_file: "results/sim_concatenated_database.fa"
fasta_simplify_headers: True

use_ProHap: True

phased_local_path: "simulated/"
phased_vcf_file_name: "chr{chr}.*vcf.gz"
sample_metadata_file: "simulated/samples.tsv"

working_dir_name_haplo: haplotypes_tmp

phased_min_af: 0
phased_af_field: AF
haplo_min_freq: 0
haplo_min_count: 0

x_par1_to: 2781479
x_par2_from: 155701383

haplo_require_start: 1
haplo_ignore_UTR: 1
haplo_skip_start_lost: 1
max_cores: 1

haplo_fasta_file: "results/sim_haplotype_translations.fa"
haplo_cdna_file: "results/sim_haplotype_cdnas.fa"
haplo_table_file: "results/sim_haplotypes.tsv"

use_ProVar: False
variant_vcf: {}
working_dir_name_var: variants_tmp
var_require_start: 1
var_fasta_file: ""
var_cdna_file: ""
var_table_file: ""

add_existing_haplo: False
haplo_added_table: ""
haplo_added_fasta: ""
